name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs~/**'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'docs~/requirements.txt'

      - name: Install dependencies
        run: python -m pip install -r "docs~/requirements.txt"

      - name: Read package version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          with Path("package.json").open(encoding="utf-8") as package_file:
              version = json.load(package_file)["version"]

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment_file:
              environment_file.write(f"ASN_VERSION={version}\n")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: mkdocs build --strict -f "docs~/mkdocs.yml"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs~/site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
